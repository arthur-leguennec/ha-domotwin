# Secret scanning for a PUBLIC repository: gitleaks' default rules plus what must never be committed
# here (docs/DECISIONS.md, D-012). Runs in CI and in pre-commit.
title = "DomoTwin gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "home-assistant-url"
description = "A Home Assistant address (port 8123, Nabu Casa or DuckDNS)"
regex = '''(?i)\b(?:https?|wss?)://[a-z0-9.-]+(?::8123|\.ui\.nabu\.casa|\.duckdns\.org)\b'''
keywords = ["8123", "nabu.casa", "duckdns"]
[rules.allowlist]
regexes = ['''//(?:localhost|127\.0\.0\.1):8123''']

[[rules]]
id = "private-ipv4"
description = "A private IPv4 address (home network)"
regex = '''\b(?:10\.\d{1,3}|192\.168|172\.(?:1[6-9]|2\d|3[01]))\.\d{1,3}\.\d{1,3}\b'''
keywords = ["10.", "192.168.", "172."]

[[rules]]
id = "email-address"
description = "An e-mail address"
regex = '''\b[A-Za-z0-9][A-Za-z0-9._%+-]*@[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}\b'''
keywords = ["@"]
[rules.allowlist]
regexes = [
  '''@users\.noreply\.github\.com''',
  '''@example\.(?:com|org|net)''',
  # Images at twice the size, as Home Assistant's brand images (icon@2x.png).
  '''@2x\.png$''',
]

[[rules]]
id = "home-assistant-token"
description = "A Home Assistant long-lived access token (JWT)"
regex = '''\beyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b'''
keywords = ["eyj"]

[allowlist]
description = "Generated files and this configuration"
paths = [
  '''\.gitleaks\.toml$''',
  '''(?:^|/)package-lock\.json$''',
  '''(?:^|/)Cargo\.lock$''',
]
