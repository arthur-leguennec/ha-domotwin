show:
  fields:
    room:
      example: Kitchen
      selector:
        text:
    element:
      example: lamp-sofa
      selector:
        text:
    storey:
      example: Floor 1
      selector:
        text:
    view:
      example: walk
      selector:
        select:
          custom_value: true
          options:
            - overview
            - 3d
            - 2d
            - walk
    person:
      example: person.alex
      selector:
        entity:
          domain: person
    screen:
      example: hallway
      selector:
        text:
where:
  fields:
    name:
      example: Alex
      selector:
        text:
    show:
      default: false
      selector:
        boolean:
    screen:
      example: hallway
      selector:
        text:
schedule:
  fields:
    entity_id:
      required: true
      example: light.lantern
      selector:
        entity:
          multiple: true
          domain:
            - light
            - switch
            - fan
            - input_boolean
            - media_player
            - climate
            - humidifier
            - siren
            - cover
    action:
      default: "on"
      selector:
        select:
          options:
            - "on"
            - "off"
    at:
      example: "2026-11-02 06:30:00"
      selector:
        datetime:
    delay:
      example: "00:10:00"
      selector:
        duration:
    until:
      example: "06:45:00"
      selector:
        datetime:
    duration:
      example: "00:15:00"
      selector:
        duration:
    brightness:
      example: 100
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
unschedule:
  fields:
    id:
      example: 01JB5Q8Z7J2E3S5T6V8W9X0Y1Z
      selector:
        text:
    entity_id:
      example: light.lantern
      selector:
        entity:
          multiple: true
