[package]
name = "domotwin-analysis"
description = "DomoTwin analysis: reads a radio mesh's snapshot and an automation's configuration, and analyses them; draws the QR codes of the home's Wi-Fi and of a guest's link; advises where the next radio helps most. Its own wasm module, loaded only when the network map, the automations, a QR code or the radio coverage are shown."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
domotwin-core.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
console_error_panic_hook.workspace = true
qrcodegen.workspace = true

[lints]
workspace = true
