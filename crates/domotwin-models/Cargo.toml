[package]
name = "domotwin-models"
description = "DomoTwin 3D model import: reads glTF 2.0 (GLB or embedded glTF), OBJ, STL and 3MF files into a compact mesh. Its own wasm module, loaded only when a plan shows or imports a 3D file."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Its WebAssembly API: left out where only its readers are used (the plan import's ZIP and XML).
default = ["web"]
web = ["dep:wasm-bindgen", "dep:console_error_panic_hook"]

[dependencies]
serde_json.workspace = true
miniz_oxide.workspace = true
wasm-bindgen = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true, optional = true }

[dev-dependencies]
domotwin-core.workspace = true

[lints]
workspace = true
