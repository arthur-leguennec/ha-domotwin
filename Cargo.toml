[workspace]
resolver = "3"
members = ["crates/domotwin-core", "crates/domotwin-render", "crates/domotwin-web"]
exclude = ["fuzz"]

[workspace.package]
# The crates are internal (never published): the product version lives in
# custom_components/domotwin/manifest.json and frontend/package.json (see docs/DECISIONS.md, D-011).
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/arthur-leguennec/ha-domotwin"
publish = false

[workspace.dependencies]
domotwin-core = { path = "crates/domotwin-core" }
domotwin-render = { path = "crates/domotwin-render" }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
three-d = { version = "=0.19.0", default-features = false }
glow = "=0.17.0"
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
web-sys = "=0.3.106"
console_error_panic_hook = "=0.1.7"
wasm-bindgen-test = "=0.3.79"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
# The core must never panic on user input: no unwrap/expect/panic outside tests.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 1
