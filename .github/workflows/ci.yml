name: CI

# One workflow for the checks a pull request needs, each run only when the change concerns it
# (scripts/ci-changes.sh). A job skipped by its condition counts as passed for the required checks,
# so the job names are those the ruleset requires (docs/REPO_SETTINGS.md). If finding what changed
# fails, every job runs. See docs/DECISIONS.md, D-020.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  # The weekly run and a merge to main do not cancel each other.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
      deny: ${{ steps.changes.outputs.deny }}
      frontend: ${{ steps.changes.outputs.frontend }}
      python: ${{ steps.changes.outputs.python }}
      hassfest: ${{ steps.changes.outputs.hassfest }}
      hacs: ${{ steps.changes.outputs.hacs }}
      build: ${{ steps.changes.outputs.build }}
      e2e: ${{ steps.changes.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/ci-changes.sh

  rust:
    name: rust
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Clippy for the browser target
        run: cargo clippy --locked -p domotwin-web -p domotwin-ifc --target wasm32-unknown-unknown --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  wasm-tests:
    name: rust wasm tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: wasm-bindgen@0.2.129
      - name: wasm-bindgen-test in headless Chrome (software WebGL2)
        working-directory: crates/domotwin-web
        run: CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" cargo test --locked --target wasm32-unknown-unknown

  deny:
    name: cargo deny
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.deny == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check

  frontend:
    name: frontend
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  python:
    name: python
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.python == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # The whole environment is kept (the exact Python and the pinned requirements are the key):
      # installing Home Assistant's test tools takes most of the job otherwise.
      - id: venv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.venv-domotwin
          key: venv-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements_test.txt') }}
      - name: Install the requirements
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv ~/.venv-domotwin
          ~/.venv-domotwin/bin/pip install -r requirements_test.txt
      - run: echo "$HOME/.venv-domotwin/bin" >> "$GITHUB_PATH"
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests
      - run: mypy
      - run: pytest -q

  hassfest:
    name: hassfest
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.hassfest == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master

  hacs:
    name: HACS validation
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.hacs == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          # brands: the integration is added to home-assistant/brands before the HACS submission.
          ignore: brands

  bundle:
    name: bundle
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.build == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Build the engine and the frontend
        run: scripts/build.sh
      - name: The committed TypeScript declarations of the wasm modules are up to date
        run: git diff --exit-code -- frontend/src/engine/pkg/domotwin_web.d.ts frontend/src/ifc/pkg/domotwin_ifc.d.ts
      - name: First-load budget (wasm + JS ≤ 1.2 MB gzipped)
        run: |
          node scripts/check-bundle-size.mjs --json bundle-size.json | tee bundle-size.md
          { echo "### Bundle size"; echo; cat bundle-size.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend
          path: custom_components/domotwin/frontend/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-size
          path: bundle-size.json
          retention-days: 30

  e2e:
    name: e2e
    needs: [changes, bundle]
    if: ${{ !cancelled() && needs.bundle.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.e2e == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend
          path: custom_components/domotwin/frontend/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: E2E with a mocked hass, visual regression and frame-time smoke test
        run: npx playwright test
      - name: Frame time
        if: always()
        run: |
          file="$(find test-results -name frame-time.json | head -n 1)"
          if [ -n "$file" ]; then
            { echo "### Frame time (software WebGL2)"; echo; echo '```json'; cat "$file"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            cp "$file" frame-time.json
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: frame-time
          path: frontend/frame-time.json
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
