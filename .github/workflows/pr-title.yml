name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional-commit:
    name: conventional commit title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            style
            revert
            deps
          requireScope: false
          # Dependabot writes "Bump …" with a capital: its titles are generated, not reviewed.
          ignoreLabels: |
            dependencies
          subjectPattern: ^[a-z].*[^.]$
          subjectPatternError: >
            The subject "{subject}" of "{title}" must start with a lower-case letter and must not end
            with a full stop, e.g. "feat: add the room panel".
