name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  zip:
    name: domotwin.zip
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - run: scripts/build.sh
      - run: node scripts/check-bundle-size.mjs
      - name: Zip the integration (its files at the root of the archive, as HACS expects)
        run: |
          cd custom_components/domotwin
          find . -name '__pycache__' -prune -exec rm -rf {} +
          # The whole integration, the build's manifest included, so that the smoke test
          # (scripts/ha-smoke.mjs) runs on the zip as released.
          zip -r -9 "$GITHUB_WORKSPACE/domotwin.zip" .
          cd "$GITHUB_WORKSPACE" && sha256sum domotwin.zip > domotwin.zip.sha256
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" domotwin.zip domotwin.zip.sha256 --clobber --repo "$GITHUB_REPOSITORY"
