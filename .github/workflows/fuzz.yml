name: Fuzz

on:
  schedule:
    - cron: "5 2 * * 0"
  pull_request:
    paths:
      - "crates/domotwin-core/**"
      - "fuzz/**"
  workflow_dispatch:
    inputs:
      seconds:
        description: Fuzzing time per target, in seconds
        default: "600"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan-reader:
    name: fuzz plan reader
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned nightly (fuzz/rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-fuzz@0.13.2
      - name: Fuzz (60 s on pull requests, 10 min on schedule)
        env:
          SECONDS_INPUT: ${{ inputs.seconds }}
          EVENT: ${{ github.event_name }}
        run: |
          seconds=600
          if [ "$EVENT" = "pull_request" ]; then seconds=60; fi
          if [ -n "$SECONDS_INPUT" ]; then seconds="$SECONDS_INPUT"; fi
          mkdir -p corpus/plan_reader
          # The prebuilt cargo-fuzz defaults to its own (musl) target: name the runner's.
          cargo fuzz run --target x86_64-unknown-linux-gnu plan_reader corpus/plan_reader seeds/plan_reader -- \
            -max_total_time="$seconds" -max_len=200000
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          retention-days: 30
