name: Fuzz

# One job builds the fuzz targets once (cached) and runs those the change concerns: the plan reader,
# the edit overlay and the plan editor's changes for the core, the IFC reader for the IFC import, the 3D model readers for
# user models (scripts/ci-changes.sh).
# Not a required check: it only runs when the code it fuzzes changes.

on:
  schedule:
    - cron: "5 2 * * 0"
  pull_request:
    paths:
      - "crates/domotwin-core/**"
      - "crates/domotwin-ifc/**"
      - "crates/domotwin-models/**"
      - "examples/**"
      - "fuzz/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/fuzz.yml"
  workflow_dispatch:
    inputs:
      seconds:
        description: Fuzzing time per target, in seconds
        default: "600"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    # Five targets of 10 minutes each on schedule, plus the build.
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        working-directory: fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Targets the change concerns
        id: changes
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # The weekly and manual runs fuzz everything.
          if [ "$EVENT" = pull_request ]; then
            scripts/ci-changes.sh
          else
            { echo fuzz_core=true; echo fuzz_ifc=true; echo fuzz_models=true; } >> "$GITHUB_OUTPUT"
          fi
      - name: Install the pinned nightly (fuzz/rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-fuzz@0.13.2
      - name: Fuzz (60 s per target on pull requests, 10 min on schedule)
        env:
          SECONDS_INPUT: ${{ inputs.seconds }}
          EVENT: ${{ github.event_name }}
          CORE: ${{ steps.changes.outputs.fuzz_core }}
          IFC: ${{ steps.changes.outputs.fuzz_ifc }}
          MODELS: ${{ steps.changes.outputs.fuzz_models }}
        run: |
          seconds=600
          if [ "$EVENT" = "pull_request" ]; then seconds=60; fi
          if [ -n "$SECONDS_INPUT" ]; then seconds="$SECONDS_INPUT"; fi
          targets=()
          if [ "$CORE" = true ]; then
            targets+=("plan_reader:200000" "edit_layout:20000" "plan_draft:640")
          fi
          if [ "$IFC" = true ]; then targets+=("ifc_reader:200000"); fi
          if [ "$MODELS" = true ]; then targets+=("model_file:200000"); fi
          # A crash in one target does not stop the others; the step fails at the end.
          status=0
          for entry in "${targets[@]}"; do
            target="${entry%%:*}"
            mkdir -p "corpus/$target"
            echo "::group::$target"
            # The prebuilt cargo-fuzz defaults to its own (musl) target: name the runner's.
            cargo fuzz run --target x86_64-unknown-linux-gnu "$target" "corpus/$target" "seeds/$target" -- \
              -max_total_time="$seconds" -max_len="${entry##*:}" || { status=1; echo "::error::$target failed"; }
            echo "::endgroup::"
          done
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Also when the time runs out: the crashes found so far.
        if: failure() || cancelled()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          retention-days: 30
