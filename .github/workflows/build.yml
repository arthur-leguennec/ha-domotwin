name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Build the engine and the frontend
        run: scripts/build.sh
      - name: The committed TypeScript declaration of the engine is up to date
        run: git diff --exit-code -- frontend/src/engine/pkg/domotwin_web.d.ts
      - name: First-load budget (wasm + JS ≤ 1.2 MB gzipped)
        run: |
          node scripts/check-bundle-size.mjs --json bundle-size.json | tee bundle-size.md
          { echo "### Bundle size"; echo; cat bundle-size.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend
          path: custom_components/domotwin/frontend/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-size
          path: bundle-size.json
          retention-days: 30

  e2e:
    name: e2e
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend
          path: custom_components/domotwin/frontend/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: E2E with a mocked hass, visual regression and frame-time smoke test
        run: npx playwright test
      - name: Frame time
        if: always()
        run: |
          file="$(find test-results -name frame-time.json | head -n 1)"
          if [ -n "$file" ]; then
            { echo "### Frame time (software WebGL2)"; echo; echo '```json'; cat "$file"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            cp "$file" frame-time.json
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: frame-time
          path: frontend/frame-time.json
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
