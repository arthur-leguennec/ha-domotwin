name: Feature request
description: Suggest an idea for DomoTwin.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do that you cannot do today?
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: How could DomoTwin help?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
