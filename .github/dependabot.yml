version: 2
# Every pull request runs the CI: compatible updates come grouped, one pull request per ecosystem
# and week. Updates that may break (majors, cargo 0.x minors, TypeScript) stay apart.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: deps, include: scope }
    groups:
      wasm-bindgen:
        patterns: ["wasm-bindgen*", "js-sys", "web-sys"]
      # For 0.x crates a minor version may break the API: only patches come grouped.
      cargo-patch:
        patterns: ["*"]
        update-types: ["patch"]
    ignore:
      # glow must stay on the version three-d builds on (the engine hands its context to three-d);
      # it is bumped by hand together with three-d.
      - dependency-name: glow
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: deps, include: scope }
    groups:
      lint:
        patterns: ["eslint", "@eslint/*", "typescript-eslint", "prettier", "globals"]
      test:
        patterns: ["vitest", "happy-dom", "@playwright/test"]
      npm-minor:
        patterns: ["*"]
        # typescript-eslint follows TypeScript minors late (D-011): TypeScript comes alone.
        exclude-patterns: ["typescript"]
        update-types: ["minor", "patch"]
    ignore:
      # typescript-eslint supports TypeScript < 6.1 (docs/DECISIONS.md, D-011).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: deps, include: scope }
    groups:
      home-assistant:
        patterns: ["pytest-homeassistant-custom-component", "home-assistant-frontend"]
      pip-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: ci, include: scope }
    groups:
      actions:
        patterns: ["*"]
