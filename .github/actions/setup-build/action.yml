name: Set up the build tools
description: Rust (pinned), wasm-bindgen-cli, binaryen (wasm-opt) and Node.js with the frontend dependencies.
runs:
  using: composite
  steps:
    - name: Install the pinned toolchain (rust-toolchain.toml)
      shell: bash
      run: rustup show active-toolchain || rustup toolchain install
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
    - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
      with:
        tool: wasm-bindgen@0.2.129
    - name: Install binaryen (wasm-opt), checksum verified
      shell: bash
      env:
        BINARYEN_VERSION: "133"
        BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
      run: |
        archive="binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
        curl -fsSL -o "$RUNNER_TEMP/$archive" \
          "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/$archive"
        echo "$BINARYEN_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
        tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install the frontend dependencies
      shell: bash
      working-directory: frontend
      run: npm ci
