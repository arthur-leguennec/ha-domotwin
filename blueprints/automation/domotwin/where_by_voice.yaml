blueprint:
  name: DomoTwin – where is someone, by voice
  description: >-
    Ask Assist "where is Alex?" (or "où est Alex ?"): DomoTwin answers with the room Alex is in, and
    can show it on your screens. "Who is home?" ("qui est à la maison ?") names everyone at home and
    their rooms. The people are the ones DomoTwin places (its panel, People); "where are my keys?"
    ("où sont mes clés ?") finds a device DomoTwin follows by Bluetooth (its panel, Bluetooth).
  domain: automation
  source_url: https://github.com/arthur-leguennec/ha-domotwin/blob/main/blueprints/automation/domotwin/where_by_voice.yaml
  input:
    sentences:
      name: Sentences for one person or thing
      description: >-
        What to say to ask for one person or thing; {name} is their name. One sentence per line,
        with [optional words].
      default:
        - "where is {name}"
        - "where's {name}"
        - "where are {name}"
        - "où est {name}"
        - "où sont {name}"
        - "où se trouve {name}"
        - "où se trouvent {name}"
        - "wo ist [der|die|das|mein|meine] {name}"
        - "wo sind [die|meine] {name}"
        - "wo (befindet|befinden) sich [der|die|das|mein|meine] {name}"
        - "dónde está [el|la|mi] {name}"
        - "dónde están [los|las|mis] {name}"
        - "dónde se (encuentra|encuentran) [el|la|los|las|mi|mis] {name}"
        - "(dov'è|dove è|dove si trova) [il mio|la mia|il|lo|la|l'] {name}"
        - "dove (sono|si trovano) [i miei|le mie|i|gli|le] {name}"
        - "waar is [de|het|mijn] {name}"
        - "waar zijn [de|mijn] {name}"
        - "waar (bevindt|bevinden) zich [de|het|mijn] {name}"
        - "onde (está|fica) [o meu|a minha|o|a|meu|minha] {name}"
        - "onde (estão|ficam) [os meus|as minhas|os|as|meus|minhas] {name}"
        - "onde se (encontra|encontram) [o|a|os|as] {name}"
        - "cadê [o|a|os|as|meu|minha|meus|minhas] {name}"
        - "onde (tá|tão) [o|a|os|as|meu|minha|meus|minhas] {name}"
        - "(أين|اين) (يوجد|توجد|يكون|تكون) {name}"
        - "(أين|اين|وين) {name}"
        - "[我的]{name}在哪[里|儿]"
        - "[我的]{name}在什么地方"
        - "[我的]{name}去哪[里|儿]了"
        - "{name}(は|って)どこ[にいる|にいます|にある|にあります|です][か|の]"
        - "{name}の居場所を教えて[ください]"
        - "[내|제] {name}[는|가|이] (어디 있어|어딨어|어디에 있어)[요]"
        - "[내|제] {name}[는|가|이] (어디야|어디예요)"
      selector:
        text:
          multiple: true
    everyone:
      name: Sentences for everyone
      description: What to say to ask who is home, and where.
      default:
        - "who is [at] home"
        - "qui est à la maison"
        - "wer ist [gerade] (zu Hause|zuhause|daheim)"
        - "quién (está|hay) en casa"
        - "chi (è|c'è) (a|in) casa"
        - "wie is [er] thuis"
        - "quem [é que] está em casa"
        - "quem tá em casa"
        - "(من|مين) (في المنزل|في البيت|بالمنزل|بالبيت)"
        - "من الموجود في (المنزل|البيت)"
        - "[有]谁在家[里]"
        - "家里有谁[在]"
        - "(誰が家に|家に誰が)(いる|います)[の|か]"
        - "家にいるのは誰"
        - "(누가 집에|집에 누가|집에 누구) 있어[요]"
      selector:
        text:
          multiple: true
    show:
      name: Show the room
      description: Also show the person's room on the DomoTwin screens.
      default: true
      selector:
        boolean:
    screen:
      name: Screen
      description: >-
        The screen to show it on: the `screen` option of a DomoTwin card. Empty for every screen.
      default: ""
      selector:
        text:

mode: queued
max: 5

triggers:
  - trigger: conversation
    command: !input sentences
    id: one
  - trigger: conversation
    command: !input everyone
    id: everyone

variables:
  show: !input show
  screen: !input screen

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: one
        sequence:
          - action: domotwin.where
            data:
              name: "{{ trigger.slots.name }}"
              show: "{{ show }}"
              screen: "{{ screen }}"
            response_variable: where
    default:
      - action: domotwin.where
        response_variable: where
  - set_conversation_response: "{{ where.text }}"
