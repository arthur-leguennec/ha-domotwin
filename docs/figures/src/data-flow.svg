<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title { font: 700 40px Inter, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 21px Inter, sans-serif; fill: #475569; }
      .when { font: 700 24px Inter, sans-serif; fill: #0f172a; }
      .step { font: 400 19px Inter, sans-serif; fill: #334155; }
      .tag { font: 600 14px Inter, sans-serif; }
      .legend { font: 500 17px Inter, sans-serif; fill: #475569; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8" />
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc" />
  <text x="80" y="92" class="title">What happens when…</text>
  <text x="80" y="132" class="subtitle">Four situations cover everything DomoTwin does. The colour says who does the work.</text>
  <g transform="translate(80 162)">
    <circle cx="10" cy="10" r="10" fill="#0ea5e9" /><text x="30" y="16" class="legend">Home Assistant</text>
    <circle cx="210" cy="10" r="10" fill="#6366f1" /><text x="230" y="16" class="legend">your screen</text>
    <circle cx="380" cy="10" r="10" fill="#f97316" /><text x="400" y="16" class="legend">3D engine</text>
  </g>

  <!-- one row per situation: trigger, three steps -->
  <!-- row 1 -->
  <g transform="translate(80 220)">
    <rect width="1440" height="140" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
    <text x="32" y="62" class="when">You open the card</text>
    <text x="32" y="96" class="step" fill="#64748b">or the panel</text>
    <rect x="1290" y="20" width="126" height="30" rx="15" fill="#dcfce7" /><text x="1353" y="41" class="tag" fill="#166534" text-anchor="middle">works now</text>
    <circle cx="420" cy="70" r="20" fill="#0ea5e9" /><text x="452" y="66" class="step">Home Assistant sends</text><text x="452" y="92" class="step">your plan</text>
    <line x1="660" y1="70" x2="700" y2="70" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)" />
    <circle cx="740" cy="70" r="20" fill="#f97316" /><text x="772" y="66" class="step">the engine builds</text><text x="772" y="92" class="step">the 3D home</text>
    <line x1="960" y1="70" x2="1000" y2="70" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)" />
    <circle cx="1040" cy="70" r="20" fill="#f97316" /><text x="1072" y="66" class="step">it is drawn once,</text><text x="1072" y="92" class="step">then nothing moves</text>
  </g>

  <!-- row 2 -->
  <g transform="translate(80 385)">
    <rect width="1440" height="140" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
    <text x="32" y="62" class="when">A lamp turns on</text>
    <text x="32" y="96" class="step" fill="#64748b">by a switch, an automation…</text>
    <rect x="1290" y="20" width="126" height="30" rx="15" fill="#fef3c7" /><text x="1353" y="41" class="tag" fill="#92400e" text-anchor="middle">milestone M2</text>
    <circle cx="420" cy="70" r="20" fill="#0ea5e9" /><text x="452" y="66" class="step">Home Assistant</text><text x="452" y="92" class="step">reports the change</text>
    <line x1="660" y1="70" x2="700" y2="70" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)" />
    <circle cx="740" cy="70" r="20" fill="#f97316" /><text x="772" y="66" class="step">the lamp lights up</text><text x="772" y="92" class="step">in the 3D home</text>
    <line x1="960" y1="70" x2="1000" y2="70" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)" />
    <circle cx="1040" cy="70" r="20" fill="#f97316" /><text x="1072" y="66" class="step">frames stop as soon</text><text x="1072" y="92" class="step">as the fade is over</text>
  </g>

  <!-- row 3 -->
  <g transform="translate(80 550)">
    <rect width="1440" height="140" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
    <text x="32" y="62" class="when">You tap a lamp</text>
    <text x="32" y="96" class="step" fill="#64748b">on the 3D or 2D view</text>
    <rect x="1290" y="20" width="126" height="30" rx="15" fill="#fef3c7" /><text x="1353" y="41" class="tag" fill="#92400e" text-anchor="middle">milestone M2</text>
    <circle cx="420" cy="70" r="20" fill="#f97316" /><text x="452" y="66" class="step">the engine finds what</text><text x="452" y="92" class="step">is under your finger</text>
    <line x1="660" y1="70" x2="700" y2="70" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)" />
    <circle cx="740" cy="70" r="20" fill="#0ea5e9" /><text x="772" y="66" class="step">Home Assistant</text><text x="772" y="92" class="step">switches the lamp</text>
    <line x1="960" y1="70" x2="1000" y2="70" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)" />
    <circle cx="1040" cy="70" r="20" fill="#6366f1" /><text x="1072" y="66" class="step">the view shows the</text><text x="1072" y="92" class="step">real new state</text>
  </g>

  <!-- row 4 -->
  <g transform="translate(80 715)">
    <rect width="1440" height="140" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
    <text x="32" y="62" class="when">You rearrange</text>
    <text x="32" y="96" class="step" fill="#64748b">administrators, edit mode</text>
    <rect x="1290" y="20" width="126" height="30" rx="15" fill="#fef3c7" /><text x="1353" y="41" class="tag" fill="#92400e" text-anchor="middle">milestone M3</text>
    <circle cx="420" cy="70" r="20" fill="#f97316" /><text x="452" y="66" class="step">you move a piece,</text><text x="452" y="92" class="step">it snaps into place</text>
    <line x1="660" y1="70" x2="700" y2="70" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)" />
    <circle cx="740" cy="70" r="20" fill="#0ea5e9" /><text x="772" y="66" class="step">only your changes</text><text x="772" y="92" class="step">are saved</text>
    <line x1="960" y1="70" x2="1000" y2="70" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)" />
    <circle cx="1040" cy="70" r="20" fill="#6366f1" /><text x="1072" y="66" class="step">every open screen</text><text x="1072" y="92" class="step">updates</text>
  </g>
</svg>
