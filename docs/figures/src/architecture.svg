<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860">
  <defs>
    <style>
      .title { font: 700 40px Inter, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 21px Inter, sans-serif; fill: #475569; }
      .head { font: 700 28px Inter, sans-serif; fill: #0f172a; }
      .text { font: 400 20px Inter, sans-serif; fill: #334155; }
      .tech { font: 500 16px Inter, sans-serif; fill: #64748b; }
      .flow { font: 600 18px Inter, sans-serif; fill: #334155; }
      .banner { font: 600 21px Inter, sans-serif; fill: #166534; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b" />
    </marker>
  </defs>
  <rect width="1600" height="860" fill="#f8fafc" />
  <text x="80" y="92" class="title">How DomoTwin is built</text>
  <text x="80" y="132" class="subtitle">Three parts, each with one job. All of it runs in your own home.</text>

  <!-- 1. Home Assistant -->
  <rect x="80" y="190" width="400" height="430" rx="28" fill="#e0f2fe" />
  <g transform="translate(200 230)">
    <!-- a small server -->
    <rect x="20" y="10" width="120" height="130" rx="14" fill="#ffffff" stroke="#0ea5e9" stroke-width="4" />
    <rect x="40" y="34" width="80" height="18" rx="6" fill="#bae6fd" />
    <rect x="40" y="66" width="80" height="18" rx="6" fill="#bae6fd" />
    <rect x="40" y="98" width="80" height="18" rx="6" fill="#bae6fd" />
    <circle cx="112" cy="43" r="4" fill="#22c55e" /><circle cx="112" cy="75" r="4" fill="#22c55e" /><circle cx="112" cy="107" r="4" fill="#22c55e" />
  </g>
  <text x="280" y="430" class="head" text-anchor="middle">Home Assistant</text>
  <text x="280" y="472" class="text" text-anchor="middle">Keeps your plan</text>
  <text x="280" y="500" class="text" text-anchor="middle">and runs your devices.</text>
  <text x="280" y="580" class="tech" text-anchor="middle">DomoTwin integration · Python</text>

  <!-- 2. Browser -->
  <rect x="600" y="190" width="400" height="430" rx="28" fill="#eef2ff" />
  <g transform="translate(690 250)">
    <!-- a laptop and a phone -->
    <rect x="0" y="0" width="170" height="110" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="4" />
    <rect x="14" y="14" width="142" height="82" rx="4" fill="#c7d2fe" />
    <path d="M-16,118 L186,118 L176,132 L-6,132 z" fill="#6366f1" />
    <rect x="186" y="34" width="56" height="98" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="4" />
    <rect x="194" y="46" width="40" height="70" rx="3" fill="#c7d2fe" />
  </g>
  <text x="800" y="430" class="head" text-anchor="middle">Your screen</text>
  <text x="800" y="472" class="text" text-anchor="middle">Shows the card and the panel,</text>
  <text x="800" y="500" class="text" text-anchor="middle">passes on your taps.</text>
  <text x="800" y="580" class="tech" text-anchor="middle">Browser or app · TypeScript</text>

  <!-- 3. Engine -->
  <rect x="1120" y="190" width="400" height="430" rx="28" fill="#fff7ed" />
  <g transform="translate(1320 300)">
    <!-- an isometric house -->
    <path d="M0,-60 L80,-20 L0,20 L-80,-20 z" fill="#fed7aa" stroke="#f97316" stroke-width="4" stroke-linejoin="round" />
    <path d="M-80,-20 L0,20 L0,90 L-80,50 z" fill="#ffffff" stroke="#f97316" stroke-width="4" stroke-linejoin="round" />
    <path d="M80,-20 L0,20 L0,90 L80,50 z" fill="#ffedd5" stroke="#f97316" stroke-width="4" stroke-linejoin="round" />
  </g>
  <text x="1320" y="430" class="head" text-anchor="middle">3D engine</text>
  <text x="1320" y="472" class="text" text-anchor="middle">Builds the home in 3D and</text>
  <text x="1320" y="500" class="text" text-anchor="middle">draws it only when it changes.</text>
  <text x="1320" y="580" class="tech" text-anchor="middle">Rust compiled to WebAssembly</text>

  <!-- arrows -->
  <line x1="492" y1="330" x2="588" y2="330" stroke="#64748b" stroke-width="4" marker-end="url(#a)" marker-start="url(#a)" />
  <text x="540" y="300" class="flow" text-anchor="middle">plan</text>
  <text x="540" y="372" class="flow" text-anchor="middle">live states</text>
  <text x="540" y="398" class="flow" text-anchor="middle">your actions</text>
  <line x1="1012" y1="330" x2="1108" y2="330" stroke="#64748b" stroke-width="4" marker-end="url(#a)" marker-start="url(#a)" />
  <text x="1060" y="300" class="flow" text-anchor="middle">plan in</text>
  <text x="1060" y="372" class="flow" text-anchor="middle">picture out</text>

  <!-- banner -->
  <rect x="80" y="680" width="1440" height="110" rx="24" fill="#dcfce7" />
  <g transform="translate(130 708)">
    <path d="M28,0 L56,12 L56,32 C56,48 44,58 28,64 C12,58 0,48 0,32 L0,12 z" fill="#22c55e" />
    <path d="M16,32 L25,41 L42,22" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="216" y="730" class="banner">Private by design</text>
  <text x="216" y="764" class="text">No cloud, no tracking, no downloads from the internet: every file comes from your Home Assistant.</text>
</svg>
