<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
  <defs>
    <style>
      .title { font: 700 34px Inter, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 19px Inter, sans-serif; fill: #475569; }
      .zone { font: 700 22px Inter, sans-serif; }
      .zone-note { font: 400 16px Inter, sans-serif; fill: #475569; }
      .card-title { font: 700 19px Inter, sans-serif; fill: #0f172a; }
      .card-sub { font: 500 15px "JetBrains Mono", monospace; fill: #475569; }
      .chip { font: 500 15px Inter, sans-serif; fill: #0f172a; }
      .label { font: 600 15px Inter, sans-serif; fill: #334155; }
      .label-sub { font: 400 14px "JetBrains Mono", monospace; fill: #475569; }
      .footer { font: 500 16px Inter, sans-serif; fill: #166534; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="1600" height="1060" fill="#f8fafc" />
  <text x="64" y="76" class="title">How DomoTwin is built</text>
  <text x="64" y="110" class="subtitle">Three layers, each with one job. Everything runs inside your own Home Assistant.</text>

  <!-- Home Assistant server -->
  <rect x="64" y="148" width="1472" height="250" rx="22" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2" />
  <text x="92" y="186" class="zone" fill="#0369a1">Home Assistant server</text>
  <text x="92" y="210" class="zone-note">Your machine, your network</text>

  <rect x="92" y="232" width="900" height="142" rx="16" fill="#ffffff" filter="url(#shadow)" />
  <text x="116" y="266" class="card-title">DomoTwin integration</text>
  <text x="330" y="266" class="card-sub">custom_components/domotwin · Python, thin</text>
  <g>
    <rect x="116" y="286" width="150" height="34" rx="17" fill="#e0f2fe" /><text x="191" y="309" class="chip" text-anchor="middle">Config flow</text>
    <rect x="276" y="286" width="230" height="34" rx="17" fill="#e0f2fe" /><text x="391" y="309" class="chip" text-anchor="middle">Storage · plan + overlay</text>
    <rect x="516" y="286" width="150" height="34" rx="17" fill="#e0f2fe" /><text x="591" y="309" class="chip" text-anchor="middle">Bindings</text>
    <rect x="676" y="286" width="290" height="34" rx="17" fill="#e0f2fe" /><text x="821" y="309" class="chip" text-anchor="middle">Websocket API · admin writes</text>
    <rect x="116" y="328" width="150" height="34" rx="17" fill="#e0f2fe" /><text x="191" y="351" class="chip" text-anchor="middle">Static files</text>
    <rect x="276" y="328" width="230" height="34" rx="17" fill="#e0f2fe" /><text x="391" y="351" class="chip" text-anchor="middle">Sidebar panel + card</text>
    <rect x="516" y="328" width="150" height="34" rx="17" fill="#e0f2fe" /><text x="591" y="351" class="chip" text-anchor="middle">Diagnostics</text>
  </g>

  <rect x="1018" y="232" width="494" height="142" rx="16" fill="#ffffff" filter="url(#shadow)" />
  <text x="1042" y="266" class="card-title">Home Assistant core</text>
  <text x="1042" y="298" class="chip">Entity states, services, areas,</text>
  <text x="1042" y="324" class="chip">users and permissions, sun, weather</text>
  <text x="1042" y="356" class="zone-note">DomoTwin reads them, it never copies them</text>

  <!-- arrows server <-> browser -->
  <line x1="300" y1="404" x2="300" y2="512" stroke="#334155" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="318" y="448" class="label">Websocket</text>
  <text x="318" y="470" class="label-sub">plan · bindings · subscribe</text>

  <line x1="760" y1="404" x2="760" y2="512" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="778" y="448" class="label">HTTP, once</text>
  <text x="778" y="470" class="label-sub">domotwin.js · .wasm · fonts</text>

  <line x1="1265" y1="404" x2="1265" y2="512" stroke="#334155" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="1283" y="448" class="label">Live states</text>
  <text x="1283" y="470" class="label-sub">hass · callService</text>

  <!-- Browser -->
  <rect x="64" y="518" width="1472" height="452" rx="22" fill="#eef2ff" stroke="#6366f1" stroke-width="2" />
  <text x="92" y="556" class="zone" fill="#4338ca">Browser or companion app</text>
  <text x="92" y="580" class="zone-note">Dashboard card or full-screen sidebar panel</text>

  <rect x="92" y="602" width="1416" height="112" rx="16" fill="#ffffff" filter="url(#shadow)" />
  <text x="116" y="636" class="card-title">Frontend</text>
  <text x="222" y="636" class="card-sub">frontend/ · TypeScript + Lit</text>
  <g>
    <rect x="116" y="656" width="180" height="34" rx="17" fill="#eef2ff" /><text x="206" y="679" class="chip" text-anchor="middle">Card · panel · editor</text>
    <rect x="306" y="656" width="250" height="34" rx="17" fill="#eef2ff" /><text x="431" y="679" class="chip" text-anchor="middle">Room panel and popovers</text>
    <rect x="566" y="656" width="190" height="34" rx="17" fill="#eef2ff" /><text x="661" y="679" class="chip" text-anchor="middle">Toolbar and layers</text>
    <rect x="766" y="656" width="190" height="34" rx="17" fill="#eef2ff" /><text x="861" y="679" class="chip" text-anchor="middle">English · French</text>
    <rect x="966" y="656" width="250" height="34" rx="17" fill="#eef2ff" /><text x="1091" y="679" class="chip" text-anchor="middle">Render-on-demand scheduler</text>
    <rect x="1226" y="656" width="258" height="34" rx="17" fill="#eef2ff" /><text x="1355" y="679" class="chip" text-anchor="middle">Pauses off-screen and hidden</text>
  </g>

  <line x1="800" y1="718" x2="800" y2="770" stroke="#334155" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="818" y="748" class="label-sub">loadPlan · setStates · pick · setViewMode · frame</text>

  <!-- WebAssembly -->
  <rect x="92" y="776" width="1416" height="172" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="2" />
  <text x="116" y="808" class="zone" fill="#c2410c">WebAssembly engine</text>
  <text x="380" y="808" class="card-sub">Rust · about 70 kB gzipped in M0</text>

  <rect x="116" y="826" width="410" height="104" rx="14" fill="#ffffff" filter="url(#shadow)" />
  <text x="138" y="860" class="card-title">domotwin-web</text>
  <text x="138" y="888" class="chip">The only part that knows JavaScript:</text>
  <text x="138" y="912" class="chip">a small typed API for the frontend</text>

  <rect x="596" y="826" width="410" height="104" rx="14" fill="#ffffff" filter="url(#shadow)" />
  <text x="618" y="860" class="card-title">domotwin-render</text>
  <text x="618" y="888" class="chip">three-d on WebGL2: batched meshes,</text>
  <text x="618" y="912" class="chip">materials, light, shadows, effects</text>

  <rect x="1076" y="826" width="410" height="104" rx="14" fill="#ffffff" filter="url(#shadow)" />
  <text x="1098" y="860" class="card-title">domotwin-core</text>
  <text x="1098" y="888" class="chip">Pure Rust, heavily tested: plan, walls,</text>
  <text x="1098" y="912" class="chip">geometry, bindings, state → visuals</text>

  <line x1="530" y1="878" x2="590" y2="878" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arrow)" />
  <line x1="1010" y1="878" x2="1070" y2="878" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- footer -->
  <rect x="64" y="992" width="1472" height="44" rx="12" fill="#dcfce7" />
  <text x="800" y="1020" class="footer" text-anchor="middle">Private by design: no CDN, no telemetry, no analytics, no web fonts. Every file is served by your Home Assistant.</text>
</svg>
