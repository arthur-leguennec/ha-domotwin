[package]
name = "domotwin-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
domotwin-core = { path = "../crates/domotwin-core" }
domotwin-ifc = { path = "../crates/domotwin-ifc" }
# Whatever version the core is pinned to (the root Cargo.toml).
serde_json = { version = "1", default-features = false, features = ["std"] }

[[bin]]
name = "plan_reader"
path = "fuzz_targets/plan_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ifc_reader"
path = "fuzz_targets/ifc_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "edit_layout"
path = "fuzz_targets/edit_layout.rs"
test = false
doc = false
bench = false

[workspace]
