[package]
name = "domotwin-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
domotwin-core = { path = "../crates/domotwin-core" }
domotwin-import = { path = "../crates/domotwin-import" }
domotwin-models = { path = "../crates/domotwin-models" }
# Whatever version the core is pinned to (the root Cargo.toml).
serde_json = { version = "1", default-features = false, features = ["std"] }

[[bin]]
name = "plan_reader"
path = "fuzz_targets/plan_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ifc_reader"
path = "fuzz_targets/ifc_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "plan_import"
path = "fuzz_targets/plan_import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "model_file"
path = "fuzz_targets/model_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "edit_layout"
path = "fuzz_targets/edit_layout.rs"
test = false
doc = false
bench = false

[[bin]]
name = "plan_draft"
path = "fuzz_targets/plan_draft.rs"
test = false
doc = false
bench = false

[[bin]]
name = "automation"
path = "fuzz_targets/automation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "upkeep"
path = "fuzz_targets/upkeep.rs"
test = false
doc = false
bench = false

[workspace]
